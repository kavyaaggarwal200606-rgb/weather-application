<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container">
        <div class="topa">
        <h1 class="head">kavya weather app</h1>
        <div class="snd">
        <input type="text" placeholder="check">
        <button class="search">Search weather</button>
        </div>
        </div>
        <div class="tepp">
            <div class="tap1">
        <i class="fa-solid fa-temperature-full"></i>
        <h1 class="temp"></h1>
        </div>
        <h2 class="repeat"></h2>
        </div>

        <div class="bottom hide">
            <div class="box1 box">
            <div class="show1 sho">
                <p>🤔</p>
                <p class="feel">20° C</p>
                </div>
          <h2>feels-like</h2>   
          </div>
        <div class="box2 box">
            <div class="show2 sho">
                <i class="fa-solid fa-water"></i>
                <p class="humidity">53%</p>
                </div>
          <h2>humidity</h2>
        </div>
            <div class="box3 box">
                <div class="show3 sho">
               <i class="fa-solid fa-wind"></i>

                <p class="speed"> 53 km/h</p>
                </div>
          <h2>Wind-speed</h2>
            </div>
            <div class="box4 box">
                <div class="show4 sho">
               <i class="fa-solid fa-cloud"></i>

                <p class="cloud"> 53 km/h</p>
                </div>
          <h2>Cloud</h2>
            </div>
            <div class="box5 box">
                <div class="show5 sho">
               <i class="fa-solid fa-water-ladder"></i>

                <p class="b-cloud"> 53 km/h</p>
                </div>
          <h2>Sea_Level</h2>
            </div>
            <div class="box6 box">
                <h1 class="country">country : </h1>
            </div>
            

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
